name: VT Bioprinter Controller CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  controller-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r raspberry_pi/requirements.txt

      - name: Compile Python controller modules
        run: |
          python -m py_compile             raspberry_pi/webapp/app.py             raspberry_pi/webapp/realsense.py             raspberry_pi/webapp/calibration.py             raspberry_pi/webapp/print_plan.py             raspberry_pi/webapp/experiments.py             raspberry_pi/webapp/quality.py             raspberry_pi/webapp/vision.py             raspberry_pi/controller_self_test.py

      - name: Run offline controller self-tests
        working-directory: raspberry_pi
        run: python controller_self_test.py

      - name: Check browser JavaScript syntax
        run: node --check raspberry_pi/webapp/static/app.js
